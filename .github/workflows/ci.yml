name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    name: Foundation & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Schema validate/generate read the URL; no live database is required here.
      DATABASE_URL: postgresql://amber:amber@127.0.0.1:5432/amber
      SKIP_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Security stubs (fail closed if skipped)
        run: pnpm test:security
      - name: Assert no gate.override
        run: pnpm assert:no-gate-override
      - name: Integration tests (Testcontainers)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: OpenAPI generate + validate
        run: |
          SKIP_DB=1 pnpm openapi:generate
          pnpm openapi:validate
      - name: Migration validate
        run: pnpm prisma:validate

  local-rc:
    name: Local RC (real API + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amber
          POSTGRES_PASSWORD: amber
          POSTGRES_DB: amber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amber -d amber"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://amber:amber@127.0.0.1:5432/amber
      APP_DATABASE_URL: postgresql://amber:amber@127.0.0.1:5432/amber
      SESSION_SECRET: dev-only-session-secret
      MFA_ENCRYPTION_KEY: dev-only-mfa-key-not-for-prod
      SESSION_COOKIE_SECURE: "false"
      WEB_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      API_INTERNAL_URL: http://127.0.0.1:3001
      GIT_SHA: ${{ github.sha }}
      BUILD_ID: local-rc-ci
      AMBER_SEED_M3: "1"
      REDIS_URL: ""
      LOG_LEVEL: info
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: amberminio
      S3_SECRET_KEY: amberminio
      S3_BUCKET: amber-files
      S3_FORCE_PATH_STYLE: "true"
      AMBER_REQUIRE_S3: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Start MinIO (live Local RC object storage)
        run: |
          docker compose up -d minio
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio ready"
              break
            fi
            if [[ "$i" -eq 45 ]]; then
              echo "MinIO never became ready" >&2
              docker compose logs minio >&2 || true
              exit 1
            fi
            sleep 1
          done
      - name: Migrate + M3 seed
        run: |
          pnpm prisma:migrate
          AMBER_SEED_M3=1 pnpm prisma:seed
      - name: Reset rehearsal (drop → migrate → seed + pre-M4 upgrade, assert deterministic IDs)
        run: bash scripts/local-rc/rehearse-reset.sh
      - name: Build API
        run: pnpm --filter @amber/shared build && pnpm --filter @amber/api build
      - name: Install Playwright Chromium
        run: pnpm --filter @amber/web exec playwright install --with-deps chromium
      - name: Playwright Local RC (real stack)
        run: pnpm --filter @amber/web test:e2e:local-rc
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-rc1-local-rc-evidence
          path: |
            docs/development/m3.8-evidence
            docs/development/m3-rc1-evidence
            docs/ux/evidence/m4.2
            docs/ux/evidence/m4.3
            docs/ux/evidence/m4.4
            docs/ux/evidence/m4.5
            docs/ux/evidence/m4.6
            docs/ux/evidence/m4.7
            docs/ux/evidence/m4.8
            docs/ux/evidence/m5.3
            docs/development/m4.8-evidence
          if-no-files-found: warn

